name: deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: enable pnpm
        run: corepack enable

      - name: install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm check

      - name: widget boundary
        run: pnpm check-boundary

      - name: build
        run: pnpm build

      - name: publish dist/ to the live branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: live
          force_orphan: true
