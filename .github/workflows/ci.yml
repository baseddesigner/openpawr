name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: enable pnpm
        run: corepack enable

      - name: install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm check

      - name: widget boundary
        run: pnpm check-boundary

      - name: build
        run: pnpm build
